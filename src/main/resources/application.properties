spring.application.name=hotel

# DB PROPERTIES
# Tell JPA / Hibernate to manage schema/update (development use)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# showing SQL queries in our logs
spring.jpa.properties.hibernate.show-sql=true
spring.jpa.show-sql=true

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel
spring.datasource.username=arpit.malik
spring.datasource.password=
